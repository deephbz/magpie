<main><h1>#391 界面预览</h1><p class="m">commit 8e1426c · <a href="https://github.com/yetone/magpie/pull/391">回到 PR</a> · 这个 diff 给 magpie web 加了一套只在小屏／触屏（≤760px，或 pointer: coarse 且 ≤1024px）生效的响应式样式：顶栏导航自成一横行并可横向滚动、用量页筛选换行且搜索独占一行、图表日期标签按宽度隐藏、设置／供应商／路由组表单改为单列堆叠、模型选择器限制在视口内且触屏不自动聚焦，另外改了触摸惯性滚动的手势判定和窄屏下不再收缩顶栏。</p>
